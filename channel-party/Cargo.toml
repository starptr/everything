# channel-party workspace. See DESIGN.md §10 for the component layout: a fixed core
# (cp-model interface, cp-core mechanisms, cp-frontend server, cp-bin composition root)
# plus open-ended vertical-slice type crates under kinds/.
[workspace]
resolver = "2"
members = [
  "crates/cp-model",
  "crates/cp-core",
  "crates/cp-frontend",
  "crates/cp-bin",
  "kinds/basic",
  "kinds/space",
  "kinds/discord-compatible",
  "kinds/canvas",
]

# Names this virtual workspace for crane (which otherwise warns it can't find a package `name` in
# the root Cargo.toml when building the fmt/taplo/deny checks).
[workspace.metadata.crane]
name = "channel-party"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
cp-model = { path = "crates/cp-model" }
cp-core = { path = "crates/cp-core" }
cp-frontend = { path = "crates/cp-frontend" }
cp-basic = { path = "kinds/basic" }
cp-space = { path = "kinds/space" }
cp-discord = { path = "kinds/discord-compatible" }
cp-canvas = { path = "kinds/canvas" }

# External crates
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
# Matches the rand_core the argon2/password-hash stack uses; `getrandom` exposes `OsRng` for salts +
# session tokens.
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2"
# Discord REST client for the discord-compatible slice (#10). Default features use rustls, matching the
# rest of the workspace. `twilight-model` carries the Discord types; tests mock it via twilight's proxy.
twilight-http = "0.16"
twilight-model = "0.16"
wiremock = "0.6"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1", features = ["serde"] }
