# cargo-deny configuration (run by the flake's `deny` check).

[advisories]
version = 2

[bans]
# A local personal tool: tolerate duplicate transitive versions rather than
# failing the build over them.
multiple-versions = "allow"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
