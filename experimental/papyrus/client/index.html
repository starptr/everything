<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>papyrus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter (UI font) only; terminal mono fonts are self-hosted from /fonts (see index.css). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Resolve the saved theme preference before first paint to avoid a flash.
         Mirrors src/theme.ts (fixed theme, or follow-system via matchMedia). -->
    <script>
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem("papyrus:theme") || "null");
          var name;
          if (pref && pref.mode === "fixed" && typeof pref.theme === "string") {
            name = pref.theme;
          } else {
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var map = (pref && pref.mode === "system" && pref.mapping) || { light: "light", dark: "dark" };
            name = dark ? map.dark : map.light;
          }
          document.documentElement.dataset.theme = name || "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
